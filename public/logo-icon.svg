<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background square with subtle rounded corners -->
  <rect width="64" height="64" rx="10" fill="#2563EB"/>

  <!-- House roof: a clean pentagon pointing upward, white -->
  <!-- Roof ridge at y=10, eaves at y=30, left x=8, right x=56 -->
  <polygon points="32,9 56,30 8,30" fill="white" opacity="0.95"/>

  <!-- House body: rectangle from y=30 to y=55 -->
  <rect x="12" y="30" width="40" height="25" rx="1" fill="white" opacity="0.15"/>

  <!-- Bar chart bars inside the house body: 3 ascending bars -->
  <!-- Bar 1 (left, shortest): x=17, bottom y=53, height=10 -->
  <rect x="17" y="43" width="7" height="10" rx="1.5" fill="#10B981"/>

  <!-- Bar 2 (middle, medium): x=28.5, bottom y=53, height=16 -->
  <rect x="28" y="37" width="7" height="16" rx="1.5" fill="#34D399"/>

  <!-- Bar 3 (right, tallest): x=40, bottom y=53, height=22 -->
  <rect x="39" y="31" width="7" height="22" rx="1.5" fill="#6EE7B7"/>

  <!-- Baseline / floor line -->
  <line x1="13" y1="54" x2="51" y2="54" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Chimney accent: small rectangle on roof top-left -->
  <rect x="21" y="20" width="5" height="8" rx="1" fill="white" opacity="0.5"/>
</svg>
